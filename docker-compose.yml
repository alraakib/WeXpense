services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL:-https://wexpense.is-from.bd}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/wexpense
      REDIS_URI: redis://redis:6379
      REDIS_DB: '0'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL:-https://wexpense.is-from.bd}
      APP_URL: ${APP_URL:-https://wexpense.is-from.bd}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-alraakib@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      QUEUE_DRIVER: bullmq
      LOG_LEVEL: warn
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
